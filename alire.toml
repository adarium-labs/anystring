name = "anystrings"
description = "A string abstraction library"
version = "0.3.0-dev"

authors = ["Heziode"]
maintainers = ["Quentin DAUPRAT (Heziode) <contact@adarium.dev>"]
maintainers-logins = ["heziode"]
licenses = "Apache-2.0 WITH LLVM-exception"
website = ""
tags = ["string", "abstraction", "vss", "uxstrings"]

[[depends-on]]
uxstrings = "~0.9"

[[depends-on]]
vss_text = "~26"

[[depends-on]]
umwi = "~0.2"

[configuration.variables]
ANYSTRING_WITH_WIDTH = {type = "Boolean", default = false}

[environment]
UXS_VARIANT.set = "UXS1"

[[pins]]
umwi = { path='../umwi' }
# vss_text 26.0.0/26.2.0 do not compile with GNAT >= 16 (RM 6.4.1(6.4) now
# enforced in VSS.Strings.Cursors.Iterators.Characters). Commit 7dd4c48 is
# v26.0.0 + 9 commits and contains the upstream fix. Drop this pin once a
# vss_text release including it is published in the Alire index.
vss_text = { url = "https://github.com/AdaCore/vss-text", commit = "7dd4c487cac67b822104f65160c97aa252055c96" }
