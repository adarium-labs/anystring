# Demonstrates:
#   - String_Types command-line bridge              (FUNC-CMDLINE-001..009)
#   - String_Types filesystem boundary             (FUNC-DIR-001..008)
#   - String_Types.Width display-width / graphemes (FUNC-WIDTH-003..006, 010..016)
#
# Usage:
#   cd examples && alr build
#   bin/standard/anystrings_cmdline_demo hello world
#   bin/standard/anystrings_filesystem_demo
#   STRING_TYPE=wide_string alr build && bin/wide_string/utf_8/anystrings_cmdline_demo hello
#   STRING_TYPE=wide_string alr build && bin/wide_string/utf_8/anystrings_filesystem_demo
#
#   # Width demo (requires ANYSTRING_WITH_WIDTH=true; pulls umwi ~0.2):
#   ANYSTRING_WITH_WIDTH=true alr build && bin/standard/anystrings_width_demo
#   STRING_TYPE=uxstring ANYSTRING_WITH_WIDTH=true alr build && bin/uxstring/anystrings_width_demo
#   STRING_TYPE=wide_string ANYSTRING_WITH_WIDTH=true alr build && bin/wide_string/utf_8/anystrings_width_demo
name = "anystrings_examples"
description = ""
version = "0.1.0-dev"

authors = ["Heziode"]
maintainers = ["Quentin DAUPRAT (Heziode) <contact@adarium.dev>"]
maintainers-logins = ["heziode"]
licenses = "Apache-2.0 WITH LLVM-exception"
website = ""
tags = []

executables = ["anystrings_examples", "anystrings_env_encoding_regression"]

[[depends-on]]
anystrings = "*"

[[pins]]
anystrings = { path='..' }
